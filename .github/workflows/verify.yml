name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm --prefix illustrated-prototype test
      - run: npm --prefix illustrated-prototype run check
      - run: npm run check:design
      - run: npm run check:audio
      - run: npm run check:publication
      - run: npm run build
      - run: npm run check:pages
