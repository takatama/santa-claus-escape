name: Trailer tools
on:
  pull_request:
    paths: ['tools/trailer/**', '.github/workflows/trailer.yml']
  push:
    paths: ['tools/trailer/**', '.github/workflows/trailer.yml']
permissions:
  contents: read
jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/trailer/requirements.txt
      - run: python -m pip install -r tools/trailer/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tools/trailer -p 'test_*.py'
