<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101f35" />
  <title>サンタの脱出 — まほう使いと遊ぶ</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="storybook conversation-storybook" aria-label="サンタの脱出、まほう使いとの遊び">
    <section class="scene-shell" aria-label="まほう使いとサンタのいる雪の森">
      <canvas id="scene" width="1600" height="1000" role="img" aria-label="開いた枝の奥にまほう使い。サンタはまだスノーボールの中です。"></canvas>
      <header class="masthead">
        <div class="title-block"><h1>サンタの脱出<span class="title-star" aria-hidden="true">✦</span></h1><p id="chapter">まほう使い</p></div>
        <button id="reset" class="reset-button" type="button">最初に戻す</button>
      </header>
      <p id="loading" class="loading-message" role="status">雪の森に、明かりをともしています…</p>
    </section>
    <section class="reader-panel conversation-panel" aria-labelledby="conversation-title">
      <p id="question-count" class="question-count" hidden></p>
      <h2 id="conversation-title" class="question-title" tabindex="-1">まほう使いが、あらわれた。</h2>
      <div id="segments" class="conversation-segments" aria-live="polite" aria-atomic="true"></div>
      <div id="actions" class="conversation-actions"></div>
      <p id="feedback" class="conversation-feedback" role="status"></p>
      <p id="save-notice" class="save-notice" role="status" hidden></p>
      <footer class="prototype-links conversation-links"><a id="forest-link" href="../explore/index.html?journey=1">雪の森へ戻る</a></footer>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
