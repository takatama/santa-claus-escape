<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101f35" />
  <meta name="description" content="球の中のサンタの声に気づき、助けることを選ぶ、サンタの脱出のはじまり。" />
  <title>サンタの脱出 — サンタの声</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../witch/style.css" />

</head>
<body>
  <main class="storybook conversation-storybook intro-storybook" aria-label="サンタの脱出、はじまりのお話">

      <canvas id="scene" width="1600" height="1000" role="img" aria-label="雪の森で、サンタがスノーボールの中から呼びかけています。"></canvas>
      <header class="masthead">
        <div class="title-block"><h1>サンタの脱出<span class="title-star" aria-hidden="true">✦</span></h1><p id="chapter">サンタの声</p></div>

      <h2 id="story-title" class="question-title" tabindex="-1">サンタの声</h2>
      <div id="segments" class="conversation-segments" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./main.js"></script>
