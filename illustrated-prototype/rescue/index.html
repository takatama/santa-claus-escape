<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101f35" />
    <meta name="description" content="金色の光をほどき、スノーボールからサンタが解放される場面を確かめる、動く絵本の試作。" />
    <title>サンタの脱出 — 救出の動作試作</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23efd093' d='m20 3 4.3 11.8L37 15l-10.2 7.5L30.5 35 20 27.4 9.5 35l3.7-12.5L3 15l12.7-.2Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="storybook rescue-storybook" aria-label="サンタの脱出、救出の動作試作">
      <section class="scene-shell" aria-label="魔法がほどける雪の森の絵">
        <canvas id="scene" width="1600" height="1000" tabindex="0" aria-label="スノーボールに沿った金色の光を右へ引くと、サンタを閉じ込めた魔法がほどけます。" aria-describedby="interaction-help">
          雪の森でサンタを救う絵です。下の「魔法を少しほどく」「少し戻す」、または「解放の進み具合」スライダーで進められます。
        </canvas>
        <header class="masthead">
          <div class="title-block">
            <h1>サンタの脱出<span class="title-star" aria-hidden="true">✦</span></h1>
            <p>三つの遊びのあと — 救出の動作試作</p>
          </div>
          <button id="reset" class="reset-button" type="button">最初に戻す</button>
        </header>
        <p id="loading" class="loading-message" role="status">雪の森に、魔法の光をともしています…</p>
      </section>
      <section class="reader-panel" aria-label="救出の操作">
        <p id="narration" class="narration" aria-live="polite" aria-atomic="true">球のふちに、金色の光がつながった。</p>
        <div class="controls">
          <button id="close" class="step-button" type="button"><span aria-hidden="true">‹</span>少し戻す</button>
          <div class="progress-control">
            <label for="progress">解放の進み具合</label>
            <input id="progress" type="range" min="0" max="100" step="1" value="0" aria-label="解放の進み具合" />
          </div>
          <button id="open" class="step-button open-button" type="button">魔法を少しほどく<span aria-hidden="true">›</span></button>
        </div>
        <p id="interaction-help" class="interaction-hint"><span>金色の光を右へ引く · タップでも進みます</span><span class="keyboard-hint">← → で調整 · Home / End</span></p>
        <section id="conclusion" class="conclusion" aria-label="サンタのお話" tabindex="-1" hidden aria-live="polite"></section>
        <footer class="prototype-links" aria-label="試作の関連ページ">
          <a href="../index.html">魔法使いの発見へ</a>
          <a href="../storyboard/index.html">全編の絵コンテへ</a>
          <span>試作 / 決定稿ではありません</span>
        </footer>
      </section>
      <nav id="rescue-next" class="rescue-next" aria-label="救出後のお話へ" hidden>
        <button id="read-conclusion" type="button" aria-controls="conclusion">サンタのお話を読む<span aria-hidden="true"> ›</span></button>
      </nav>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
